# ap-pinner configuration — copy to mydevices.conf and edit
#
# How the network is reached: this script SSHes to a GATEWAY (your router, from
# the machine running the script), and from there opens one forwarded port per
# access point. If your machine can already reach the APs, keep the defaults and
# point GATEWAY_HOST at the router anyway: it is the same path.

# --- the router everything goes through
GATEWAY_HOST="192.168.1.1"
GATEWAY_PORT="22"
GATEWAY_USER="root"
SSH_KEY="$HOME/.ssh/id_ed25519"        # key for the gateway
SSH_KEY_AP="$HOME/.ssh/id_ed25519"     # key for the access points (often the same)

# --- the access points: index=ip  (index is what you use in DEVICES below)
AP_NODES="1=192.168.1.2 2=192.168.1.3 3=192.168.1.4"

# --- wireless sections to touch on every AP
# On OpenWrt the client radios are usually default_radio0/1/2. Check with:
#   uci show wireless | grep -E '^wireless.default_radio[0-9]+=' 
RADIOS="radio0 radio1 radio2"

# --- the devices to pin: name|MAC|AP index where the device MUST stay
# MACs are case-insensitive. One line per device. Lines starting with # are ignored.
DEVICES="
Shelly bathroom light|AA:BB:CC:11:22:33|2
Shelly bedroom shutter|AA:BB:CC:44:55:66|3
TV in the living room|AA:BB:CC:77:88:99|1
"

# --- timing
SETTLE=25            # seconds to wait after a wifi reload (clients drop)
BASE_PORT=2202       # forwarded ports are BASE_PORT, BASE_PORT+1, ...
BACKUP_MARK=appinner # backups land in /root/wireless.bak.<mark>.<date> on each AP
